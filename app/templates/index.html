<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NAS相册</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="app">
  <!-- 顶部导航栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <h1 id="siteTitle" class="logo" onclick="showAlbums()">📸 相册</h1>
      <select id="deviceSwitcher" onchange="switchDevice(this.value)" style="background:#0f3460;color:#e0e0e0;border:1px solid #2c3e50;border-radius:4px;padding:3px 6px;font-size:12px;margin-left:4px;max-width:120px">
        <option value="">当前设备</option>
      </select>
      <span class="breadcrumb" id="breadcrumb"></span>
    </div>
    <div class="topbar-right">
      <button class="btn-icon" onclick="toggleAutoPlay()" id="autoPlayBtn" title="自动播放">▶</button>
      <button class="btn-icon" onclick="refreshIndex()" title="刷新">🔄</button>
    </div>
  </header>

  <!-- 相册选择页 -->
  <div id="albumsPage" class="page">
    <div class="album-grid" id="albumGrid">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <!-- 照片网格页 -->
  <div id="photosPage" class="page" style="display:none">
    <div class="photo-grid" id="photoGrid"></div>
    <div class="load-more" id="loadMore">加载更多...</div>
  </div>
</div>

<!-- 大图浏览遮罩 -->
<div id="viewerOverlay" class="viewer-overlay" style="display:none" onclick="closeViewer(event)">
  <div class="viewer-header">
    <button class="btn-close" onclick="closeViewer()">✕</button>
    <span class="viewer-counter" id="viewerCounter">0 / 0</span>
    <button class="btn-info" onclick="showPhotoInfo()" title="照片信息">ℹ</button>
  </div>

  <div class="viewer-container" id="viewerContainer" ontouchstart="touchStart(event)" ontouchend="touchEnd(event)">
    <button class="btn-nav btn-prev" onclick="navigatePhoto(-1)" id="btnPrev">‹</button>
    <!-- 照片 -->
    <img id="viewerImage" class="viewer-image" src="" alt="" onclick="toggleZoom(event)">
    <!-- 视频 -->
    <video id="viewerVideo" class="viewer-video" controls playsinline preload="metadata" style="display:none"
           onclick="event.stopPropagation()">
      您的浏览器不支持视频播放
    </video>
    <button class="btn-nav btn-next" onclick="navigatePhoto(1)" id="btnNext">›</button>
  </div>

  <div class="viewer-bottom" id="viewerBottom">
    <div class="toolbar">
      <button class="tool-btn" onclick="downloadPhoto()" title="下载">⬇</button>
      <button class="tool-btn" onclick="toggleLike()" id="likeBtn" title="点赞">🤍</button>
      <button class="tool-btn" onclick="toggleAutoPlay()" id="autoPlayBtn2" title="自动播放">▶</button>
      <button class="tool-btn" onclick="window.print()" title="打印">🖨</button>
      <button class="tool-btn" onclick="toggleThumbStrip()" id="thumbToggle">收起列表 ▼</button>
    </div>
    <div class="thumb-strip" id="thumbStrip">
      <div class="thumb-track" id="thumbTrack"></div>
    </div>
  </div>

  <!-- 照片信息弹窗 -->
  <div class="info-popup" id="infoPopup" style="display:none" onclick="event.stopPropagation()">
    <div class="info-content" id="infoContent"></div>
    <button onclick="document.getElementById('infoPopup').style.display='none'" style="margin-top:8px;padding:4px 16px;background:#3498db;color:#fff;border:none;border-radius:4px;">关闭</button>
  </div>
</div>

<script src="/static/app.js"></script>

<script>
// 读取管理面板的设备列表，填充切换下拉框
async function loadDeviceSwitcher() {
  try {
    const r = await fetch('http://192.168.2.104:5001/api/devices');
    const data = await r.json();
    const sel = document.getElementById('deviceSwitcher');
    if (!sel || !data.devices) return;
    const currentHost = location.hostname;
    data.devices.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.gallery_url || 'http://' + d.host + ':5000';
      opt.textContent = d.name || d.host;
      if (d.host === currentHost || (d.gallery_url && d.gallery_url.includes(currentHost))) {
        opt.disabled = true;
        opt.textContent += ' 📍';
      }
      sel.appendChild(opt);
    });
  } catch(e) {
    // 管理面板可能未运行，静默忽略
    console.log('设备列表加载失败:', e.message);
  }
}
function switchDevice(url) {
  if (url) location.href = url;
}
async function pollThumbProgress() {
  const bar = document.getElementById('thumbProgressBar');
  if (!bar) return;
  try {
    const r = await fetch('/api/thumb_progress');
    const p = await r.json();
    if (p.running && p.total > 0) {
      bar.style.display = 'block';
      document.getElementById('thumbDone').textContent = p.done;
      document.getElementById('thumbTotal').textContent = p.total;
      const pct = Math.round(p.done / p.total * 100);
      document.getElementById('thumbPct').textContent = pct;
      document.getElementById('thumbBar').style.width = pct + '%';
      setTimeout(pollThumbProgress, 3000);
    } else if (p.total > 0 && !p.running) {
      bar.style.display = 'block';
      bar.innerHTML = '\u2705 缩略图已全量生成！共 ' + p.total + ' 张';
      setTimeout(() => { bar.style.display = 'none'; }, 8000);
    }
    // total==0时不做任何事（夜间cron负责全量生成）
  } catch(e) {}
}
loadDeviceSwitcher();
</script>

</body>
</html>
